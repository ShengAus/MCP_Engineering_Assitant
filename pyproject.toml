[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elek-mcp-engineering-assistant"
version = "0.1.0"
description = "Python MCP demo with multiple engineering assistant tool servers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.1",
    "mcp>=1.8.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
